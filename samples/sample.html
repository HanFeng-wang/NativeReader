<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Native Reader HTML 预览示例</title>
  <link rel="stylesheet" href="sample.css">
</head>
<body>
  <main class="card">
    <h1>HTML 浏览器预览</h1>
    <p>这个页面由默认浏览器打开，CSS 和 JavaScript 都由浏览器加载。</p>
    <table>
      <thead><tr><th>项目</th><th>说明</th></tr></thead>
      <tbody>
        <tr><td>HTML 源码</td><td>在 Native Reader 中编辑</td></tr>
        <tr><td>CSS / JS</td><td>通过浏览器正常执行</td></tr>
      </tbody>
    </table>
    <button id="demo">点击测试 JavaScript</button>
    <p id="result" class="result">等待点击……</p>
  </main>
  <script src="sample.js"></script>
</body>
</html>
